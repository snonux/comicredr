name: comicredr
description: A local-first comic reader with guided view, for Fedora and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

workspace:
  - packages/comic_analysis
  - packages/comic_formats
  - packages/reader_input

dependencies:
  flutter:
    sdk: flutter
  comic_analysis: any
  comic_formats: any
  reader_input: any
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1
  image: ^4.5.4
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  archive: ^4.3.0

flutter:
  uses-material-design: true
  # The panel and balloon detector, packed into the Linux bundle and the
  # APK. `make` refuses to build without it; see assets/models/README.md.
  assets:
    - assets/models/
