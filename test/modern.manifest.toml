# Modern-layout eval slice (guided view on modern comics, 2026-09-24).
#
# Same rules as test/corpus.manifest.toml: fetched into the git-ignored
# test/corpus-modern/ by spike/fetch_corpus.py, never committed. These books
# are modern western comics whose panels vary in size and shape: insets,
# slanted and overlapping frames, borderless art, broken borders. None of
# them is in test/corpus.manifest.toml or test/train.manifest.toml, so the
# slice measures pages the detector has never seen. The CC-NC/ND books are
# for local testing only; the NASA and CDC books are US government works.
#
#   python3 spike/fetch_corpus.py --manifest test/modern.manifest.toml --out test/corpus-modern --skip-model
#   python3 spike/extract_pages.py test/corpus-modern PAGES --manifest test/modern.manifest.toml --per-book 400
#   python3 spike/labelkit.py import spike/labels/modern PAGES

