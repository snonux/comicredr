# Test corpus manifest (design plan section 10).
#
# Real comics are fetched into the git-ignored test/corpus/ by
# spike/fetch_corpus.py and never committed or redistributed. Public-domain
# status of golden-age and Charlton scans rests on copyright non-renewal,
# curated by the sources but not guaranteed per file. The CC-licensed books
# need attribution if a page appears in a screenshot or README; the NC-ND
# ones are for local testing only.
#
# Every entry carries a `style`; spike/extract_pages.py samples pages into one
# folder per style so the spike reports results per style. Styles cover the
# spread of western comics: golden-age grids, irregular early golden age,
# silver age, black-and-white indie, modern indie and modern painted
# full-bleed. [[search]] entries (Internet Archive queries) still work for
# finding more books; pin what proves useful as a [[book]] with its sha256.

[model]
# YOLO26s-seg, classes frame/balloon/text, trained on Manga109 (academic-use
# data). Fine for a personal spike; not for redistributed weights.
repo = "ShadowB/Manga109-panel-balloon-text-yolov26-segmentation"

