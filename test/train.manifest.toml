# Training corpus manifest for the M5 detector (spike/train.py).
#
# Same rules as test/corpus.manifest.toml: fetched into the git-ignored
# test/corpus-train/ by spike/fetch_corpus.py, never committed. None of these
# books is in the eval corpus, so the eval set measures pages the model has
# never seen. Public-domain status of golden-age and Charlton scans rests on
# copyright non-renewal. Only public-domain, CC0 and CC BY books belong here: this
# set trains the detector built into the app, which is published (Apache-2.0).
# Anything non-commercial, no-derivatives or share-alike goes in
# test/train-local.manifest.toml.
#
#   python3 spike/fetch_corpus.py --manifest test/train.manifest.toml --out test/corpus-train

