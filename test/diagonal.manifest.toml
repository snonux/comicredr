# Diagonal and tilted frames, training pages (2026-09-25).
#
# Free books whose panels are slanted wedges, diagonal gutters, or frames on
# a black page, the layouts the detector knew least. Only public domain,
# CC0 and CC BY, so they may train the bundled model. Same rules as the
# other manifests: fetched into the git-ignored test/corpus-diagonal/,
# never committed. Labels in spike/labels/diagonal/. No book here is in any
# other manifest; the eval slice (test/diagonal-eval.manifest.toml) holds
# two other books.
#
#   python3 spike/fetch_corpus.py --manifest test/diagonal.manifest.toml --out test/corpus-diagonal --skip-model

