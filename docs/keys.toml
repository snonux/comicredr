# ComicRedr keys. Copy this file to ~/.config/comicredr/keys.toml,
# or ~/Comics/.comicredr/keys.toml when ComicRedr keeps its data there
# (? says where; on the phone: Android/data/org.snonux.comicredr/files/keys.toml)
# and keep only the lines you change: an action listed here replaces
# all of its default keys, [] unbinds it, and actions left out keep
# their defaults. Restart ComicRedr to load it; ? shows what is live.
#
# Spelling: gg and zw are two keys in a row, m<a-z> takes a mark
# letter, C-f is Ctrl+f, and named keys (Left Right Up Down PageUp
# PageDown Home End Space Tab Esc Enter Backspace Delete Insert F1-F12)
# take S- for Shift. Put spaces between keys when a named key is in
# a sequence: "g Home". Two or more digits ("21") work when typed
# quickly; otherwise digits are a count. A one-letter lastPage key
# takes a page number after it (G12). 11 is the whole page; 00 leaves
# a part-of-page split.

[keys]
# Next panel in guided view, next page or spread otherwise; next cover in the library
nextStep = ["l", "Space"]
# Previous panel in guided view, previous page or spread otherwise; previous cover in the library
prevStep = ["h", "S-Space"]
# Next page, ignoring panels
nextPage = ["C-f", "PageDown"]
# Previous page, ignoring panels
prevPage = ["C-b", "PageUp"]
# Pan down; the cover below in the library
panDown = ["j", "Down"]
# Pan up; the cover above in the library
panUp = ["k", "Up"]
# Moves a zoomed page right (smoothly), else the next step, as l
scrollRight = ["Right"]
# Smooth scrolling faster: longer steps, a held key quicker; kept
scrollFaster = ["g+"]
# Smooth scrolling slower: shorter steps, a held key slower; kept
scrollSlower = ["g-"]
# Smooth scrolling smoother: softer start and stop; kept
scrollSmoother = ["g>"]
# Smooth scrolling crisper: quicker start and stop; kept
scrollCrisper = ["g<"]
# Moves a zoomed page left (smoothly), else the previous step, as h
scrollLeft = ["Left"]
# A screen down in the page grid (continuous scroll is not built yet)
halfPageDown = ["C-d"]
# A screen up in the page grid (continuous scroll is not built yet)
halfPageUp = ["C-u"]
# First page; first cover in the library
firstPage = ["gg", "Home"]
# Last page, or page N with a number after it (G12); last cover in the library
lastPage = ["G", "End"]
# Page thumbnails: pick a page to jump to
pageGrid = ["p"]
# Details of this comic: file, pages and scan quality, metadata, reading, panels and balloons found; the selected book's in the library
showDetails = ["I"]
# Next book in the series, or in the same folder
nextBook = ["]"]
# Previous book in the series, or in the same folder
prevBook = ["["]
# Guided view, there and back
toggleGuided = ["v"]
# Balloon by balloon inside each panel in guided view, on and off
toggleBalloons = ["b"]
# Whole page before and after its panels in guided view, on and off
toggleWholePage = ["w"]
# Wine red on a page guided view shows whole, and a quick step held there, on and off
togglePauseWhole = ["W"]
# Cycle single, double, guided; next library tab
cycleModeForward = ["Tab"]
# Cycle modes backwards; previous library tab
cycleModeBack = ["S-Tab"]
# Single page or two-page spread
toggleSpread = ["d"]
# Shift the spread pairing by one
shiftSpread = ["D"]
# Continuous vertical scroll (not built yet)
toggleContinuous = ["s"]
# Reading direction for this book
toggleDirection = ["r"]
# Turn the comic a quarter turn clockwise, or N quarters with a count; kept for this book, in guided view too
rotateClockwise = [">"]
# Turn the comic a quarter turn counter-clockwise
rotateCounterClockwise = ["<"]
# Turn the comic back upright
rotateReset = ["gr"]
# Fit width
fitWidth = ["zw"]
# Fit height
fitHeight = ["zh"]
# Fit whole page; re-centre the panel in guided view
fitPage = ["zz"]
# Zoom in
zoomIn = ["+"]
# Zoom out
zoomOut = ["-"]
# Reset zoom
zoomReset = ["="]
# Zoom in on that spot, or back out when zoomed; re-centre the panel in guided view
zoomToggle = ["Z"]
# Whole page: leave the enlarged part, still stepping through the split; Esc or 00 leave the split too
regionWhole = ["11"]
# Leave parts of the page and go back to the usual steps (guided view or plain paging)
regionPrevious = ["00"]
# Upper half of the page, enlarged; → and ← then go half by half, each page whole before and after; again or Esc to stop
regionUpperHalf = ["H1", "21"]
# Lower half of the page, enlarged
regionLowerHalf = ["H2", "22"]
# Upper third of the page, enlarged; → and ← then go third by third, each page whole before and after; again or Esc to stop
regionUpperThird = ["B1", "31"]
# Middle third of the page, enlarged
regionMiddleThird = ["B2", "32"]
# Lower third of the page, enlarged
regionLowerThird = ["B3", "33"]
# Top strip of four across the page, enlarged; → and ← then go strip by strip, each page whole before and after; again or Esc to stop
regionStrip1 = ["L1", "41"]
# Second strip of four from the top, enlarged
regionStrip2 = ["L2", "42"]
# Third strip of four from the top, enlarged
regionStrip3 = ["L3", "43"]
# Bottom strip of four, enlarged
regionStrip4 = ["L4", "44"]
# Top-left quarter of the page, enlarged; → and ← then go quarter by quarter, each page whole before and after; again or Esc to stop
regionTopLeft = ["Q1", "51"]
# Top-right quarter of the page, enlarged
regionTopRight = ["Q2", "52"]
# Bottom-left quarter of the page, enlarged
regionBottomLeft = ["Q3", "53"]
# Bottom-right quarter of the page, enlarged
regionBottomRight = ["Q4", "54"]
# Page parts: pick a half, third, strip or quarter of the page to enlarge; a two-finger tap opens it too
pickPart = ["gp"]
# Auto-trim scan margins
autoTrim = ["t"]
# Night filter
nightFilter = ["i"]
# Clean up old scans: paper, contrast, sharpness
cleanUp = ["c"]
# Fullscreen: no title bar or border; in the reader only the comic. Esc at the top of the library leaves it too
fullscreen = ["f", "F11"]
# Bookmark this page, or this panel in guided view; again to take the bookmark off
bookmark = ["mm"]
# Next bookmark in this book
nextBookmark = ["}"]
# Previous bookmark in this book
prevBookmark = ["{"]
# Bookmarks and marks in this book: jump, add a note, remove; the Bookmarks tab in the library
bookmarkList = ["M"]
# Add this comic to the Favourites collection, or take it out; the selected book in the library, or every marked one
toggleFavourite = ["*"]
# The Favourites collection in the library
showFavourites = ["gf"]
# Remove the selected bookmark in a bookmark list; take the selected comic out of the Favourites
remove = ["x", "Delete"]
# Set mark a-z
setMark = ["m<a-z>"]
# Jump to mark a-z
jumpMark = ["'<a-z>"]
# Jump back to before the last jump
jumpBack = ["''"]
# Search the library (searching inside a book is not built yet)
search = ["/"]
# Next match in a book (not built yet)
searchNext = ["n"]
# Previous match in a book (not built yet)
searchPrev = ["N"]
# Open a file without adding it to the library
openFile = ["o"]
# Continue the comic read last, where it was left, even after a restart; in a comic, the one read before it
continueReading = ["C"]
# Open a folder of page images as a book
openFolder = ["O"]
# Back out one level, ending at the library
back = ["Esc"]
# Up to the folder above in the library
up = ["Backspace"]
# Open the selected book, series or folder in the library
activate = ["Enter"]
# Add a folder to the library (~/Comics is in it by default, if it exists)
addRoot = ["A"]
# Rescan the library folders
rescan = ["R"]
# Shuffle in the library's tabs of covers: each comic, series and folder shows a random page instead of its cover, on and off
toggleShuffle = ["S"]
# Pick other random pages for shuffle in the library
reshuffle = ["gs"]
# Filter the library's Folders tab by type, size and modification date
filterFolders = ["F"]
# Reset this comic: find its panels again, or forget its bookmarks and position too; in the library every marked one
resetBook = ["X"]
# Delete this comic and its sidecar, after asking; the selected book in the library, or every marked one
deleteBook = ["gd", "S-Delete"]
# Upload this comic to your S3 bucket, or sync its sidecar if it is there; in the library the selected book, or every marked one
uploadToS3 = ["gu"]
# Take this comic off S3, after asking; the copy on this device stays; in the library every marked one
removeFromS3 = ["gU"]
# Library: move the selected comic, or every marked one, to another folder, picked from a list you can type into
moveBooks = ["gm"]
# Library: put the selected comic, or every marked one, in a collection, new or one you have
addToCollection = ["gc"]
# Mark the selected book in the library, or unmark it, for an action on several (move, delete, reset, favourite, collection, upload, remove from S3)
markBook = ["V"]
# Library: mark from where marking started to the cover on the left (Shift+arrows mark a run of comics)
markLeft = ["S-Left"]
# Library: mark from where marking started to the cover on the right
markRight = ["S-Right"]
# Library: mark from where marking started to the cover above
markUp = ["S-Up"]
# Library: mark from where marking started to the cover below
markDown = ["S-Down"]
# Library: mark from where marking started to the first cover
markToFirst = ["S-Home"]
# Library: mark from where marking started to the last cover
markToLast = ["S-End"]
# Library: mark every comic shown, or unmark them all when they are marked already
markAll = ["C-a"]
# Edit the selected book's title, series, issue and creators in the library; on a series, rename it
editBook = ["e"]
# Show the keymap
showKeymap = ["?"]
# Show the touch zones for a moment
showTouchZones = ["gt"]
# The time, large, for two seconds, then it fades
showTime = ["T"]

[touch]
# Touch gestures, on top of the preset picked in Settings (Standard,
# Left-handed or One thumb). Uncomment a line to change that gesture.
# Taps, double-taps and long presses take nine actions, one per zone
# of a 3x3 grid read like a page: top row first, left to right. The
# side columns are 30% of the width each. One action instead of a
# list sets the whole view; "" does nothing. Actions are the names in
# [keys] above. Pinch zoom and dragging a zoomed page always work.
# gt shows the zones while reading.
#
# tap = [
#   "prevStep", "fullscreen", "nextStep",
#   "prevStep", "fullscreen", "nextStep",
#   "prevStep", "fullscreen", "nextStep",
# ]
#
# doubleTap = [
#   "", "zoomToggle", "",
#   "", "zoomToggle", "",
#   "", "zoomToggle", "",
# ]
#
# longPress = [
#   "", "", "",
#   "", "showTime", "",
#   "", "", "",
# ]
#
# swipeLeft = "nextStep"
#
# swipeRight = "prevStep"
#
# swipeUp = ""
#
# swipeDown = ""
#
# twoFingerTap = "pickPart"
