# ComicRedr keys. Copy this file to ~/.config/comicredr/keys.toml
# (on the phone: Android/data/org.snonux.comicredr/files/keys.toml)
# and keep only the lines you change: an action listed here replaces
# all of its default keys, [] unbinds it, and actions left out keep
# their defaults. Restart ComicRedr to load it; ? shows what is live.
#
# Spelling: gg and zw are two keys in a row, m<a-z> takes a mark
# letter, C-f is Ctrl+f, and named keys (Left Right Up Down PageUp
# PageDown Home End Space Tab Esc Enter Backspace Delete Insert F1-F12)
# take S- for Shift. Put spaces between keys when a named key is in
# a sequence: "g Home".

[keys]
# Next panel in guided view, next page or spread otherwise; next cover in the library
nextStep = ["l", "Right", "Space"]
# Previous panel in guided view, previous page or spread otherwise; previous cover in the library
prevStep = ["h", "Left", "S-Space"]
# Next page, ignoring panels
nextPage = ["C-f", "PageDown"]
# Previous page, ignoring panels
prevPage = ["C-b", "PageUp"]
# Pan down, or scroll in continuous mode; the cover below in the library
panDown = ["j", "Down"]
# Pan up, or scroll in continuous mode; the cover above in the library
panUp = ["k", "Up"]
# Half-screen scroll down in continuous mode
halfPageDown = ["C-d"]
# Half-screen scroll up in continuous mode
halfPageUp = ["C-u"]
# First page; first cover in the library
firstPage = ["gg", "Home"]
# Last page, or page N with a count; last cover in the library
lastPage = ["G", "End"]
# Page thumbnails: pick a page to jump to
pageGrid = ["p"]
# Details of this comic: file, pages and scan quality, metadata, reading, panels and balloons found; the selected book's in the library
showDetails = ["I"]
# Next book in the series, or in the same folder
nextBook = ["]"]
# Previous book in the series, or in the same folder
prevBook = ["["]
# Guided view, there and back
toggleGuided = ["v"]
# Balloon by balloon inside each panel in guided view, on and off
toggleBalloons = ["b"]
# Whole page before and after its panels in guided view, on and off
toggleWholePage = ["w"]
# Hold one step on a page guided view shows whole before turning, on and off
togglePauseWhole = ["W"]
# How a held page shows it: wine-red background or zoom out and back
cyclePauseCue = ["gw"]
# Cycle single, double, continuous, guided; next library tab
cycleModeForward = ["Tab"]
# Cycle modes backwards; previous library tab
cycleModeBack = ["S-Tab"]
# Single page or two-page spread
toggleSpread = ["d"]
# Shift the spread pairing by one
shiftSpread = ["D"]
# Continuous vertical scroll on or off
toggleContinuous = ["s"]
# Reading direction for this book
toggleDirection = ["r"]
# Fit width
fitWidth = ["zw"]
# Fit height
fitHeight = ["zh"]
# Fit whole page; re-centre the panel in guided view
fitPage = ["zz"]
# Zoom in
zoomIn = ["+"]
# Zoom out
zoomOut = ["-"]
# Reset zoom
zoomReset = ["="]
# Zoom in on that spot, or back out when zoomed; re-centre the panel in guided view
zoomToggle = ["Z"]
# Auto-trim scan margins
autoTrim = ["t"]
# Night filter
nightFilter = ["i"]
# Clean up old scans: paper, contrast, sharpness
cleanUp = ["c"]
# Fullscreen: no title bar or border; in the reader only the comic. Esc at the top of the library leaves it too
fullscreen = ["f", "F11"]
# Bookmark this page, or this panel in guided view; again to take the bookmark off
bookmark = ["mm"]
# Next bookmark in this book
nextBookmark = ["}"]
# Previous bookmark in this book
prevBookmark = ["{"]
# Bookmarks and marks in this book: jump, add a note, remove; the Bookmarks tab in the library
bookmarkList = ["M"]
# Add this comic to the Favourites collection, or take it out; the selected book in the library
toggleFavourite = ["*"]
# The Favourites collection in the library
showFavourites = ["gf"]
# Remove the selected bookmark in a bookmark list; take the selected comic out of the Favourites
remove = ["x", "Delete"]
# Set mark a-z
setMark = ["m<a-z>"]
# Jump to mark a-z
jumpMark = ["'<a-z>"]
# Jump back to before the last jump
jumpBack = ["''"]
# Search the library; search the book text in the reader
search = ["/"]
# Next match
searchNext = ["n"]
# Previous match
searchPrev = ["N"]
# Open a file without adding it to the library
openFile = ["o"]
# Open a folder of page images as a book
openFolder = ["O"]
# Back out one level, ending at the library
back = ["Esc"]
# Up to the folder above in the library
up = ["Backspace"]
# Open the selected book, series or folder in the library
activate = ["Enter"]
# Add a folder to the library (~/Comics is in it by default, if it exists)
addRoot = ["A"]
# Rescan the library folders
rescan = ["R"]
# Shuffle in the library's Folders tab: each comic shows a random page instead of its cover, on and off
toggleShuffle = ["S"]
# Pick other random pages for shuffle in the Folders tab
reshuffle = ["gs"]
# Reset this comic: find its panels again, or forget its bookmarks and position too
resetBook = ["X"]
# Delete this comic and its sidecar, after asking; the selected book in the library
deleteBook = ["gd", "S-Delete"]
# Edit the selected book's title, series, issue and creators in the library; on a series, rename it
editBook = ["e"]
# Show the keymap
showKeymap = ["?"]
# Show the touch zones for a moment
showTouchZones = ["gt"]
# The time, large, for two seconds, then it fades
showTime = ["T"]

[touch]
# Touch gestures, on top of the preset picked in Settings (Standard,
# Left-handed or One thumb). Uncomment a line to change that gesture.
# Taps, double-taps and long presses take nine actions, one per zone
# of a 3x3 grid read like a page: top row first, left to right. The
# side columns are 30% of the width each. One action instead of a
# list sets the whole view; "" does nothing. Actions are the names in
# [keys] above. Pinch zoom and dragging a zoomed page always work.
# gt shows the zones while reading.
#
